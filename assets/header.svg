<svg width="1000" height="420" viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, 'Courier New', monospace">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect x="2" y="2" width="996" height="416" rx="16" fill="#0a0f0a" stroke="#1f3d1f" stroke-width="2"/>

  <!-- title bar -->
  <circle cx="34" cy="34" r="8" fill="#ff5f56"/>
  <circle cx="60" cy="34" r="8" fill="#ffbd2e"/>
  <circle cx="86" cy="34" r="8" fill="#27c93f"/>
  <text x="966" y="40" text-anchor="end" fill="#39ff14" font-size="16" font-weight="bold" letter-spacing="1">SUJAL@GITHUB</text>
  <line x1="20" y1="58" x2="980" y2="58" stroke="#1f3d1f" stroke-width="2"/>

  <!-- prompt: whoami (typewriter reveal) -->
  <g>
    <clipPath id="clipWhoami">
      <rect x="30" y="70" width="0" height="34">
        <animate attributeName="width" from="0" to="330" dur="1s" begin="0.2s" fill="freeze"/>
      </rect>
    </clipPath>
    <text x="34" y="95" clip-path="url(#clipWhoami)" fill="#39ff14" font-size="22">sujal@github:~$ whoami</text>
  </g>
  <rect x="345" y="76" width="11" height="24" fill="#39ff14">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="0.9s" begin="0.2s" repeatCount="2"/>
    <set attributeName="opacity" to="0" begin="1.4s" fill="freeze"/>
  </rect>

  <!-- big name -->
  <g opacity="0">
    <set attributeName="opacity" to="1" begin="1.5s" fill="freeze"/>
    <text x="500" y="195" text-anchor="middle" fill="#39ff14" font-size="70" font-weight="bold" filter="url(#glow)" letter-spacing="4">SUJAL KANSAL</text>
    <text x="500" y="245" text-anchor="middle" fill="#8be28b" font-size="19" letter-spacing="1">Software Developer | Data Science | Machine Learning | Problem Solver</text>
  </g>

  <line x1="20" y1="290" x2="980" y2="290" stroke="#1f3d1f" stroke-width="2" opacity="0">
    <set attributeName="opacity" to="1" begin="1.6s" fill="freeze"/>
  </line>

  <!-- bottom prompt: build_future.sh (typewriter reveal) -->
  <g opacity="0">
    <set attributeName="opacity" to="1" begin="1.9s" fill="freeze"/>
    <clipPath id="clipBuild">
      <rect x="30" y="345" width="0" height="34">
        <animate attributeName="width" from="0" to="430" dur="1.1s" begin="1.9s" fill="freeze"/>
      </rect>
    </clipPath>
    <text x="34" y="370" clip-path="url(#clipBuild)" fill="#39ff14" font-size="22">sujal@github:~$ ./build_future.sh</text>
  </g>
  <rect x="460" y="351" width="11" height="24" fill="#39ff14" opacity="0">
    <set attributeName="opacity" to="1" begin="3.0s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0;1" dur="1s" begin="3.0s" repeatCount="indefinite"/>
  </rect>
</svg>
